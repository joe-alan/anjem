name: Flutter CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'

env:
  FLUTTER_VERSION: '3.24.x'
  JAVA_VERSION: '17'

jobs:
  # Code analysis and testing
  analyze-and-test:
    name: Code Analysis & Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: flutter-deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: |
            flutter-deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Run code generation
        run: |
          flutter packages pub run build_runner build --delete-conflicting-outputs || echo "No build runner configured"

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: mobile/coverage/lcov.info
          flags: flutter
          name: flutter-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build APKs for both flavors
  build-apks:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: mobile

    strategy:
      matrix:
        flavor: [rider, driver]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: flutter-deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: |
            flutter-deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Create Firebase config placeholder
        run: |
          mkdir -p android/app/src/${{ matrix.flavor }}/
          echo '{"project_info":{"project_id":"anjem-dev"}}' > android/app/src/${{ matrix.flavor }}/google-services.json

      - name: Build APK - ${{ matrix.flavor }}
        run: |
          flutter build apk \
            --flavor ${{ matrix.flavor }} \
            --target lib/main_${{ matrix.flavor }}.dart \
            --dart-define=API_URL=https://api-staging.anjem.me/v1 \
            --dart-define=WS_URL=wss://api-staging.anjem.me \
            --obfuscate \
            --split-debug-info=build/debug-info/${{ matrix.flavor }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk \
             build/app/outputs/flutter-apk/anjem-${{ matrix.flavor }}-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anjem-${{ matrix.flavor }}-apk
          path: mobile/build/app/outputs/flutter-apk/anjem-${{ matrix.flavor }}-${{ github.sha }}.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: anjem-${{ matrix.flavor }}-debug-symbols
          path: mobile/build/debug-info/${{ matrix.flavor }}/
          retention-days: 90

  # Integration tests (runs on larger runner for better performance)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest-4-cores
    needs: analyze-and-test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: flutter-deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: |
            flutter-deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM (for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          script: |
            cd mobile
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_test.dart \
              --dart-define=API_URL=http://10.0.2.2:8000/api/v1

  # Performance analysis
  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: flutter-deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: |
            flutter-deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze bundle size
        run: |
          flutter build apk --analyze-size --target lib/main_rider.dart
          flutter build apk --analyze-size --target lib/main_driver.dart

      - name: Check for large assets
        run: |
          echo "Checking for large assets (>1MB)..."
          find . -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.webp" \
            | xargs ls -la \
            | awk '$5 > 1048576 { print "Large asset found: " $9 " (" $5 " bytes)" }'

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: flutter-deps-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: |
            flutter-deps-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run security audit
        run: |
          dart pub audit || echo "Security audit completed with warnings"

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded secrets..."
          grep -r -E "(api[_-]?key|secret|password|token)" --include="*.dart" . || echo "No hardcoded secrets found"

      - name: Verify obfuscation settings
        run: |
          echo "Checking obfuscation configuration..."
          grep -r "obfuscate" android/ || echo "Obfuscation settings verified"