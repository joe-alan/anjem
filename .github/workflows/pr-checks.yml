name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-requirements:
    name: PR Requirements
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! $PR_TITLE =~ ^(feat|fix|docs|style|refactor|test|chore|ci)(\(.+\))?\!?:\ .+ ]]; then
            echo "PR title must follow conventional commit format."
            echo "Examples: feat(auth): add login, fix(rides): null check"
            echo "Current title: $PR_TITLE"
            exit 1
          fi
          echo "PR title format OK"

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "$PR_BODY" || ${#PR_BODY} -lt 20 ]]; then
            echo "PR description is required (min 20 characters)"
            exit 1
          fi
          echo "PR description OK"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for files larger than 10MB
        run: |
          large_files=$(find . -type f -size +10M -not -path './.git/*' -not -path './vendor/*')
          if [ -n "$large_files" ]; then
            echo "Large files detected (>10MB):"
            echo "$large_files"
            exit 1
          fi
          echo "No large files detected"

      - name: Check backend config
        run: |
          cd backend
          composer validate --strict
          for var in "DB_CONNECTION" "REDIS_HOST" "APP_KEY"; do
            if ! grep -q "^$var=" .env.example; then
              echo "Missing required var $var in .env.example"
              exit 1
            fi
          done
          echo "Backend config OK"
